spring:
  application:
    name: lavajato-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/lavajato
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    org.flywaydb: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
